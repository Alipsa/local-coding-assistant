
spring.ai.ollama.base-url=http://localhost:11434
logging.pattern.console=%msg%n
logging.level.root=warn
logging.level.org.springframework.context.annotation.AnnotationBeanNameGenerator=error
spring.main.log-startup-info=false
spring.main.banner-mode=off
logging.level.org.springframework.context.support.PostProcessorRegistrationDelegate=warn
logging.level.se.alipsa.lca.repl.JLineRepl=info
logging.level.se.alipsa.lca.repl.ReplRunner=info


# Changing default LLM
# These two properties are the canonical model definitions for the whole app. They accept
# an override from the LCA_* environment variables that src/main/bin/lca exports at launch
# (the values there are, in turn, the single canonical source shared with models.sh); the
# literal after the ":" is only a fallback for runs that bypass lca (./run.sh, mvnw test, IDE).
embabel.models.default-llm=${LCA_CHAT_MODEL:qwen3.8-192k:latest}
embabel.models.default-embedding-model=${LCA_EMBEDDING_MODEL:nomic-embed-text:latest}

# Llm Roles: Create as many as you want and use with byRole("role-name")
embabel.models.llms.best=${embabel.models.default-llm}
embabel.models.llms.cheapest=${LCA_FALLBACK_MODEL:gpt-oss-64k:latest}

embabel.models.embedding-services.best=${embabel.models.default-embedding-model}
embabel.models.embedding-services.cheapest=${embabel.models.default-embedding-model}

# Set this to use your preferred LLM for ranking, to avoid default
embabel.agent-platform.ranking.llm=${embabel.models.llms.cheapest}

# Coding assistant LLM defaults
assistant.llm.model=${embabel.models.default-llm}
assistant.llm.fallback-model=${embabel.models.llms.cheapest}
assistant.llm.review-model=${LCA_REVIEW_MODEL:qwen3.8-review:latest}
assistant.llm.temperature.craft=0.7
assistant.llm.temperature.review=0.1
# LLM call timeout in milliseconds (default 12 minutes; increase for large reviews on local models)
assistant.llm.timeout-millis=720000
# Timeout for /benchmark's raw Ollama /api/generate call (separate from the short registry
# timeout used for tags/show/ps polling, since a generation call can legitimately take minutes).
assistant.llm.benchmark-timeout-millis=180000
# Local-only mode also disables web search in SessionState, so no separate web-search flag is needed
assistant.local-only=true
# Shell input behaviour
assistant.shell.auto-paste=true

# Thinking/Reasoning configuration
# Enable thinking mode support (requires LLM support)
assistant.thinking.enabled=true
# Whether to enable thinking by default for review commands (can be overridden with --with-thinking flag)
assistant.thinking.review-default=false

# Maximum characters for general review context (directory file contents). The review
# model's context window is 131072 tokens; these budgets are deliberately well under a
# naive chars-per-token conversion of that, leaving headroom for the prompt template,
# system prompt, and the model's own output. Raise cautiously and watch for context
# overflow - code tends to tokenize less efficiently than prose.
assistant.llm.review-context-budget=100000
# Maximum characters for PR review context (diff + file contents)
assistant.llm.review-pr-context-budget=250000

# Web search fetcher (htmlunit or jsoup). Set fallback-fetcher=none to disable fallback.
assistant.web-search.fetcher=htmlunit
assistant.web-search.fallback-fetcher=jsoup
# Web search summaries used for planning context (seconds)
assistant.tool-summary.ttl-seconds=600

# Intent routing
assistant.intent.enabled=true
assistant.intent.model=${embabel.models.llms.cheapest}
assistant.intent.fallback-model=${embabel.models.default-llm}
assistant.intent.temperature=0.1
assistant.intent.max-tokens=256
assistant.intent.allowed-commands=/chat,/plan,/review,/implement,/edit,/apply,/run,/gitapply,/git-push,/search,/codesearch,/diff,/stage,/commit-suggest,/context,/tree,/status,/model,/health,/benchmark,/revert,/applyBlocks,/paste,/version,/mcp,/compact,/reviewlog
assistant.intent.destructive-commands=/edit,/apply,/run,/gitapply,/git-push
assistant.intent.confidence-threshold=0.8
assistant.intent.second-opinion-threshold=0.6

# Request validation
assistant.validation.enabled=true
assistant.validation.skip-in-batch=true
assistant.validation.min-prompt-length=15
assistant.validation.max-clarification-rounds=2
assistant.validation.use-context-resolver=true

# Agent team (Dispatcher/Architect/Engineer/QA-Reviewer)
assistant.team.enabled=false
assistant.team.auto-execute=true
# Per-role temperature and timeout (seconds); models default to assistant.llm.model unless overridden.
assistant.team.dispatcher-temperature=0.1
assistant.team.architect-temperature=0.3
assistant.team.engineer-temperature=0.2
assistant.team.reviewer-temperature=0.1
assistant.team.dispatcher-timeout-seconds=30
assistant.team.architect-timeout-seconds=300
assistant.team.engineer-timeout-seconds=600
assistant.team.reviewer-timeout-seconds=300

# JLine REPL Configuration
lca.repl.enabled=true
lca.repl.prompt=lca>\u0020
lca.repl.history-file=${user.home}/.lca/history

# Swing GUI (lcaGui). Disabled by default; the lcaGui launcher enables it and disables the REPL.
lca.gui.enabled=false
# Fallback context-window size (tokens) used for the footer context gauge when Ollama does not report one.
lca.gui.default-context-window=${LCA_DEFAULT_CONTEXT_WINDOW:131072}

# Long-term memory (RAG-based recall/remember) - roadmap item 3, step 1
lca.memory.enabled=true
lca.memory.embedding-model=${embabel.models.embedding-services.cheapest}
lca.memory.index-directory=${user.home}/.lca/memory-index
lca.memory.recall-top-k=5
lca.memory.recall-min-score=0.6
# Forgotten only when BOTH thresholds are exceeded (age AND idle).
lca.memory.max-age-days=180
lca.memory.max-idle-days=30
lca.memory.prune-min-interval-minutes=60
lca.memory.surprising-learning-detection-enabled=true
lca.memory.surprising-learning-model=
# Caps so memory injection can't silently crowd out other prompt context.
lca.memory.recall-max-context-chars=2000
lca.memory.max-memory-content-chars=500
# Project scoping and same-topic supersession on write.
lca.memory.recall-over-fetch-factor=4
lca.memory.supersede-similarity-threshold=0.85
lca.memory.supersede-candidate-limit=3

# Disable Spring Shell completely (we use JLine REPL instead)
spring.shell.interactive.enabled=false
spring.autoconfigure.exclude=\
  org.springframework.shell.boot.JLineShellAutoConfiguration,\
  org.springframework.shell.boot.StandardAPIAutoConfiguration,\
  org.springframework.shell.boot.ApplicationRunnerAutoConfiguration,\
  org.springframework.shell.boot.ParameterResolverAutoConfiguration,\
  org.springframework.shell.boot.ShellContextAutoConfiguration,\
  org.springframework.shell.boot.CompleterAutoConfiguration,\
  org.springframework.shell.boot.TerminalUIAutoConfiguration,\
  org.springframework.shell.boot.ComponentFlowAutoConfiguration,\
  org.springframework.shell.boot.LineReaderAutoConfiguration,\
  org.springframework.shell.boot.ShellRunnerAutoConfiguration,\
  org.springframework.shell.boot.CommandCatalogAutoConfiguration,\
  org.springframework.shell.boot.JLineAutoConfiguration,\
  org.springframework.shell.boot.StandardCommandsAutoConfiguration,\
  org.springframework.shell.boot.ThemingAutoConfiguration,\
  org.springframework.shell.boot.ExitCodeAutoConfiguration,\
  org.springframework.shell.boot.SpringShellAutoConfiguration,\
  org.springframework.shell.boot.UserConfigAutoConfiguration

# MCP client
assistant.mcp.enabled=true
assistant.mcp.servers-configuration=
assistant.mcp.tool-description-budget=3000
assistant.mcp.confirm-destructive=true
assistant.mcp.request-timeout=20s
