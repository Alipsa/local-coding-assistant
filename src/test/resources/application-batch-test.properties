# Override custom model references with base models for testing.
# The custom large-context models (qwen3.8-192k / gpt-oss-64k) are created by the
# lca script at runtime and may not exist in the test environment.
embabel.models.default-llm=qwen3.8:27b
embabel.models.llms.best=qwen3.8:27b
embabel.models.llms.cheapest=gpt-oss:20b
embabel.agent-platform.ranking.llm=gpt-oss:20b
assistant.llm.model=qwen3.8:27b
assistant.llm.fallback-model=gpt-oss:20b
assistant.intent.model=gpt-oss:20b
assistant.intent.fallback-model=qwen3.8:27b
